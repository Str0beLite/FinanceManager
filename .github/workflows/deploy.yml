name: Deploy to GitHub Pages

on:
  push:
    branches: [main, beta]
  # Lets you redeploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  BASE: /FinanceManager/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A Pages site is a single artifact, so publishing main and beta together
      # means building both every time and combining them: main at the root,
      # beta underneath at /beta/. A push to either branch refreshes both.
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main-src/package-lock.json

      - name: Does a beta branch exist?
        id: beta
        working-directory: main-src
        run: |
          if git ls-remote --exit-code --heads origin beta >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No beta branch yet — publishing production only."
          fi

      - name: Check out beta
        if: steps.beta.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-src

      - name: Build and verify production
        working-directory: main-src
        env:
          BASE_PATH: ${{ env.BASE }}
          VITE_CHANNEL: production
        run: |
          npm ci
          npm test
          npm run build
          bash scripts/verify-build.sh dist "$BASE_PATH"

      - name: Build and verify beta
        if: steps.beta.outputs.exists == 'true'
        working-directory: beta-src
        env:
          BASE_PATH: ${{ env.BASE }}beta/
          VITE_CHANNEL: beta
        run: |
          npm ci
          npm test
          npm run build
          bash scripts/verify-build.sh dist "$BASE_PATH"

      - name: Combine into one site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r main-src/dist/. site/
          if [ "${{ steps.beta.outputs.exists }}" = "true" ]; then
            mkdir -p site/beta
            cp -r beta-src/dist/. site/beta/
            echo "Published production at / and beta at /beta/."
          else
            echo "Published production at / only."
          fi
          # Beta must not shadow production's entry point.
          test -f site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
